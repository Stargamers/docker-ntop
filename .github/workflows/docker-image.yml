name: Docker Image CI

on:
  push:
    branches: [ "arm64" ]
  pull_request:
    branches: [ "arm64" ]

jobs:

  build:

    runs-on: debian:bookworm-slim

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile.ntopng-arm64 --tag my-image-name:$(date +%s)
